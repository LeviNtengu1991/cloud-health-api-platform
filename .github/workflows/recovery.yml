name: Backup and recovery
on:
  push:
    branches: [main, codex/backup-recovery-lab]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - name: Validate optional S3 infrastructure
        run: |
          terraform -chdir=infra/backup-storage fmt -check
          terraform -chdir=infra/backup-storage init -backend=false -input=false
          terraform -chdir=infra/backup-storage validate
      - name: Create disposable local credentials
        run: python3 scripts/configure.py
      - name: Validate Compose and build containers
        run: |
          docker compose config --quiet
          docker compose build db api ops unit-tests
      - name: Unit tests
        run: make unit
      - name: Real database restore and failure tests
        run: make integration
      - name: S3 emulator round-trip with real PostgreSQL restore
        run: |
          docker compose --profile testing up -d --build --wait s3-mock
          python3 scripts/integration_s3.py
      - name: Check monitoring rules
        run: docker compose run --rm --no-deps --entrypoint promtool prometheus check rules /etc/prometheus/alerts.yml
      - name: Verify provisioned Grafana dashboard
        run: |
          docker compose --profile dashboard up -d --wait grafana recovery-metrics
          python3 scripts/check_dashboard.py
      - name: Grafana failure diagnostics
        if: failure()
        run: docker compose logs --tail=150 grafana
      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restore-evidence
          path: artifacts/*restore-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the disposable lab
        if: always()
        run: docker compose --profile dashboard --profile testing down --volumes --remove-orphans
