name: Backup and recovery
on:
  push:
    branches: [main, codex/backup-recovery-lab]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Create disposable local credentials
        run: python3 scripts/configure.py
      - name: Validate Compose and build containers
        run: |
          docker compose config --quiet
          docker compose build db api ops
      - name: Unit tests
        run: make unit
      - name: Real database restore and failure tests
        run: make integration
      - name: Check monitoring rules
        run: docker compose run --rm --no-deps --entrypoint promtool prometheus check rules /etc/prometheus/alerts.yml
      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restore-evidence
          path: artifacts/restore-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the disposable lab
        if: always()
        run: docker compose down --volumes --remove-orphans
