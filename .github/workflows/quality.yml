name: Code quality
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Python quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned tools
        run: python -m pip install -r requirements-quality.txt -r requirements.txt -r requirements-test.txt
      - name: Lint Python and annotate findings
        run: ruff check --output-format=github .
      - name: Check consistent formatting
        if: ${{ !cancelled() }}
        run: ruff format --check .
      - name: Scan runtime Python for security issues
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts
          bandit -r app.py recovery scripts/configure.py -f json -o artifacts/bandit.json
      - name: Run regression tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -v
      - name: Save security report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-security-report
          path: artifacts/bandit.json
          if-no-files-found: ignore
          retention-days: 14
